<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C16 Flappy Bird</title>
<style>
  body { margin: 0; background: #000; color: #ccc; font-family: system-ui, sans-serif; }
  main { max-width: 800px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; color: #fff; }
  #frame { width: 100%; aspect-ratio: 4 / 3; }
  a { color: #b6d84a; }
</style>
</head>
<body>
<main>
  <h1>C16 Flappy Bird</h1>
  <p>Flappy Bird für den Commodore 16. Einmal ins Bild klicken, dann lässt die Leertaste den Vogel steigen.</p>
  <div id="frame"><div id="game"></div></div>
  <p><a href="flappy.prg">flappy.prg</a> herunterladen · <a href="https://github.com/phausser/c16-flappy-bird">Quelltext</a></p>
</main>
<script>
  EJS_player = '#game';
  EJS_core = 'plus4';
  EJS_gameUrl = 'flappy.prg';
  EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  EJS_defaultOptions = { 'vice_plus4_model': 'C16 PAL' };
  EJS_color = '#b6d84a';
  window.addEventListener('keydown', function (event) {
    if (event.code === 'Space') event.preventDefault();
  });
</script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
