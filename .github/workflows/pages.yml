name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ACME 0.97 bauen
        # Ubuntu ships an older ACME without --strict. Same revision as the
        # package used for c16-pairfinity.
        run: |
          sudo apt-get update && sudo apt-get install -y subversion
          svn export -q -r 446 https://svn.code.sf.net/p/acme-crossass/code-0/trunk "$RUNNER_TEMP/acme"
          make -C "$RUNNER_TEMP/acme/src" CFLAGS="-O2 -w" LIBS="-lm"
          echo "$RUNNER_TEMP/acme/src" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/acme/src/acme" --version
      - name: Prüfen
        run: make lint
      - name: Bauen
        run: make
      - name: Seite zusammenstellen
        run: |
          mkdir site
          cp web/index.html build/flappy.prg site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
